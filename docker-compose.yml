services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-me-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_me
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-me-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chat-me-minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio-init:
    image: alpine:latest
    container_name: chat-me-minio-init
    volumes:
      - minio_data:/data
    entrypoint: >
      /bin/sh -c "
      mkdir -p /data/chat-media
      chmod -R 777 /data
      echo 'MinIO chat-media bucket initialized.'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
