name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  size-labeler:
    name: Check PR Granularity & Size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calculate Diff and Apply Size Label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalLines = additions + deletions;

            let sizeLabel = "size/xs";
            if (totalLines > 800) {
              sizeLabel = "size/xl";
            } else if (totalLines > 400) {
              sizeLabel = "size/l";
            } else if (totalLines > 200) {
              sizeLabel = "size/m";
            } else if (totalLines > 50) {
              sizeLabel = "size/s";
            }

            const sizeLabels = ["size/xs", "size/s", "size/m", "size/l", "size/xl"];
            const currentLabels = pr.labels.map(l => l.name);
            const labelsToRemove = currentLabels.filter(l => sizeLabels.includes(l) && l !== sizeLabel);

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch {
                // Ignore if label was already removed
              }
            }

            if (!currentLabels.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel],
              });
            }

            // Emit a non-blocking review warning if diff exceeds 300 lines
            if (totalLines > 300) {
              const warningMarker = "<!-- pr-size-warning -->";
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const hasWarning = comments.some(c => c.body && c.body.includes(warningMarker));
              if (!hasWarning) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `${warningMarker}\n> [!WARNING]\n> **Large Pull Request Detected**: This PR has **${totalLines}** lines changed (${additions} additions, ${deletions} deletions), which exceeds the repository granularity target (< 200–300 lines).\n>\n> Consider splitting this change into smaller, isolated sub-issues and PRs to keep reviews fast and merges safe.`,
                });
              }
            }
