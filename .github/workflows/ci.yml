name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @chat-me/web exec playwright install --with-deps chromium

      - name: Start local infrastructure containers
        run: docker compose up -d --wait

      - name: Lint (ESLint + GLOSSARY.md + Network Seams)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build All Monorepo Packages
        run: pnpm build

      - name: Run Playwright E2E Tests
        run: pnpm --filter @chat-me/web test:e2e
